name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go files are not formatted. Run 'gofmt -s -w .' to fix."
            gofmt -s -l .
            exit 1
          fi

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.23 is this module's floor (and toon-go's). 1.26 is the highest
        # version any consumer builds with today (cadence-axi). Both must pass
        # or a consumer breaks on upgrade.
        go: ['1.23', '1.26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Test with race detector
        run: go test -race ./...

  # go-axi is allowed to grow. It is not allowed to get slower. Four projects
  # depend on this layer sitting off the hot path, and the only thing that keeps
  # it there is a gate that fails.
  #
  # Pull requests only: the comparison needs a base commit to measure against,
  # and a push to main has no meaningful counterpart.
  bench:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit must be reachable to be checked out and measured.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # The faster of the two supported toolchains. The floor (1.23) is
          # covered by the test matrix; timing does not need both.
          go-version: '1.26'
          cache: true

      - name: Install benchstat
        # Pinned. An unpinned @latest would let a benchstat change alter the
        # verdict on an unrelated pull request.
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260908200009-22c9c6c9d4da

      # count=6 matches the README's "medians of six runs" and is the floor
      # benchstat needs: at count=3 it refuses a confidence interval, and it
      # wants >= 4 samples before it will call a difference significant at all.
      # benchtime=100ms keeps the whole job near a minute.
      - name: Benchmark this branch
        run: go test -run='^$' -bench=. -benchtime=100ms -count=6 . > /tmp/head.txt

      - name: Benchmark the base commit
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          git checkout --detach ${{ github.event.pull_request.base.sha }}
          go test -run='^$' -bench=. -benchtime=100ms -count=6 . > /tmp/base.txt
          git checkout --detach "$HEAD_SHA"

      - name: Enforce no regression
        run: bash .github/benchgate.sh /tmp/base.txt /tmp/head.txt

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Coverage
        run: go test -coverprofile=coverage.out ./...

      # This gate FAILS rather than warns. The sibling repos only emit a
      # ::warning:: here, which is why coverage drifted there. A library four
      # projects depend on does not get that latitude.
      - name: Enforce 80% coverage
        run: |
          # A module with no coverable statements yields a coverage.out holding
          # only its "mode:" line, while `go tool cover -func` still reports
          # "total: 0.0%" — so the total alone cannot distinguish "scaffold with
          # nothing to cover" from "real code with no tests". Count statement
          # lines instead.
          #
          # This is NOT a loophole: any real code produces statement lines, so
          # code with statements but no tests still reports 0.0% and fails below.
          STMTS=$(grep -vc '^mode:' coverage.out || true)
          if [ "${STMTS:-0}" -eq 0 ]; then
            echo "No coverable statements yet; nothing to gate."
            exit 0
          fi
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $COVERAGE% across $STMTS statement lines"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below the required 80%"
            exit 1
          fi
